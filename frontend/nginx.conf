server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;          # file Excel tải lên tối đa 5 MB (backend giới hạn lại)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Địa chỉ backend phân giải lại khi cần (backend khởi động chậm hơn / khởi động lại không làm nginx hỏng)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # xuất Excel lớn, xem PDF
        proxy_send_timeout 300s;
    }

    # File build có hash trong tên: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả index.html (không cache để cập nhật bản mới ngay)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
